{%- comment -%}
  Attributo disegnato sopra il ritratto fotografico del Guardiano.
  Il riquadro e' 0 0 100 100 e combacia con il ritratto quadrato, quindi le
  coordinate si leggono come percentuali dell'immagine.
  Parametro: slug.
{%- endcomment -%}
<svg class="attributo" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
  {%- case include.slug -%}

  {%- when "bud" -%}
  {%- comment -%}
    Barba: contorno a lobi arrotondati fra il bordo inferiore del fagiolo
    (y circa 64) e una sagoma esterna; velo d'inchiostro, non massa piena.
  {%- endcomment -%}
  <g class="tratto">
    <path d="M27 49
             C 23 59, 26 70, 33 75
             Q 36 83, 40 77
             Q 44 84, 48 77
             Q 52 85, 56 77
             Q 60 83, 64 76
             Q 68 81, 73 74
             C 79 69, 84 58, 81 49
             C 78 57, 69 63, 54 64
             C 39 63, 29 57, 27 49 Z" />
  </g>
  <g class="tratto tratto-grosso">
    <path d="M37 53 C 43 47, 50 48, 54 52 C 58 48, 65 47, 71 53" />
  </g>

  {%- when "ugo-fantocci" -%}
  {%- comment -%}
    Bombetta: la tesa poggia dentro il profilo del fagiolo (y circa 30),
    la calotta a cupola gli copre la sommita' (y 17 circa).
  {%- endcomment -%}
  <g class="tratto">
    <path d="M36 28 C 35 14, 61 14, 60 28" />
    <path d="M30 28 C 31 25, 33 24, 36 24" />
    <path d="M66 28 C 65 25, 63 24, 60 24" />
    <path d="M30 28 C 38 33, 58 33, 66 28" />
    <path d="M37 26 C 43 28, 54 28, 59 26" />
  </g>

  {%- endcase -%}
</svg>
