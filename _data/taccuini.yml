# ---------------------------------------------------------------
#  Taccuini — le frasi che il Custode preleva dal pozzo di saggezza
#  di ciascun Guardiano, a cadenza irregolare.
# ---------------------------------------------------------------
#  Chiave: lo slug del Guardiano (lo stesso di _guardiani/ e di
#  _data/posta.yml).  Ogni voce e' una raccolta:
#
#    data   -> AAAA-MM-GG, giorno in cui il Custode ha calato il secchio
#    frasi  -> una o due frasi, riportate come sono state dette
#    nota   -> facoltativo: circostanze della raccolta, a cura del Custode
#
#  Le raccolte vengono ordinate dalla pagina, dalla piu' recente.
# ---------------------------------------------------------------

bud:
  - data: 2026-11-10
    frasi:
      - Di domenica non mi risulta niente. Mi risulta che siamo dieci e che all'angolo nord il tovagliolo è asciutto.
    nota: >
      Raccolta alle 08:58. Il Custode ha domandato se ricordasse la notte della
      pentola. Bud ha ripetuto la frase, identica, e si è girato verso la finestra.
  - data: 2026-11-09
    frasi:
      - Si sta al centro per fare spazio, non per occuparlo.
      - Nove fagioli si sono disposti intorno a me e nessuno mi ha chiesto il permesso. Non chiedetelo nemmeno voi.
    nota: >
      Raccolta alle 07:40. Bud ha dettato la prima frase e poi ha taciuto per
      undici minuti. Il Custode ha atteso senza riformulare la domanda. È
      arrivata la seconda.

ugo-fantocci:
  - data: 2026-11-12
    frasi:
      - C'era un fagiolo grasso che parlava col cuoco. Non ho visto niente, ero nel sacchetto come tutti. Del tono mi ricordo: era un tono fra due che si conoscono.
      - Comunque chiedo scusa.
    nota: >
      Detta alle 07:41, ad alta voce, durante la lettura delle tre lettere non
      firmate. Il Custode non aveva rivolto domande a nessuno e non aveva fatto
      nomi. Ugo ha parlato per primo, e si è scusato dopo circa quattro secondi.
  - data: 2026-11-10
    frasi:
      - Io me lo ricordo. Nessuno me lo chiede, ma io me lo ricordo.
    nota: >
      Raccolta alle 08:55. Il Custode osserva che Ugo quella notte non ha visto
      niente più degli altri nove, e che il suo è quindi un ricordo di seconda
      mano. Osserva anche di non avere alcuna intenzione di andarglielo a dire.
  - data: 2026-11-09
    frasi:
      - Questa carta assorbente è una cagata pazzesca.
      - "Ai fagioli che verranno: il posto vicino al bordo del piattino sembra il più tranquillo. Non lo è."
    nota: >
      Raccolta alle 07:12. Il Custode ha chiesto se si riferisse alla carta del
      piattino o alla carta assorbente in generale; Ugo ha risposto «tutte e due,
      mi scusi». Ha poi domandato tre volte se la frase venisse trascritta
      davvero, e alla terza si è scusato di avere insistito.

mata-hari:
  - data: 2026-11-12
    frasi:
      - Chi si scusa per primo non è mai il primo ad avere fatto qualcosa.
    nota: >
      Raccolta alle 07:52. È l'unica difesa che Ugo abbia ricevuto, e il Custode
      osserva che Ugo non se n'è accorto.
  - data: 2026-11-10
    frasi:
      - Dimenticare è una tecnica. Non tutti quelli che la usano sanno di usarla.
    nota: >
      Raccolta alle 09:04. Alla richiesta di chiarire se stesse parlando dei nove
      o di sé, Mata Hari ha risposto che la domanda era ben posta.
  - data: 2026-11-09
    frasi:
      - Da quando sono qui non ho detto niente di falso. Non ho nemmeno detto tutto.
      - "Ai fagioli che verranno: l'umidità sa di voi più cose di quante ne sappiate voi. Trattatela con rispetto."
    nota: >
      Raccolta alle 07:25. Il Custode ha domandato se la seconda frase fosse un
      avvertimento o un consiglio. Mata Hari ha risposto che la distinzione
      dipende da chi legge.

toto:
  - data: 2026-11-14
    frasi:
      - "Il mercato è fermo perché manca la fiducia. La fiducia ce l'ho io, ma non è compresa nel prezzo."
    nota: >
      Raccolta alle 08:03, dopo che il Custode gli aveva comunicato che nella
      prima notte di listino non risultava alcuna transazione. Totò ha precisato
      di parlare in qualità di ex concessionario idrico e ha chiesto che la
      qualifica fosse scritta per esteso.
  - data: 2026-11-13
    frasi:
      - "L'acqua viene dall'alto. Tutto ciò che viene dall'alto, in questa casa, risponde a me."
      - Ma mi faccia il piacere. Il rubinetto è un fatto idraulico, il titolo è un'altra cosa.
    nota: >
      Raccolta alle 07:58, dopo che il Custode gli aveva fatto presente che
      l'acqua la porta lui, a mano, tutte le mattine, e che è gratis. Totò ha
      definito l'osservazione «un dettaglio di logistica» e ha chiesto che
      venisse verbalizzata la definizione, non l'osservazione.
  - data: 2026-11-12
    frasi:
      - Ma mi faccia il piacere. In quel piatto ci sono due che si spacciano per altri due, e si siedono a tavola col nome di quelli.
      - "Non mi offende il sapore: il sapore si aggiusta. Mi offende il casato."
    nota: >
      Raccolta alle 13:14, fuori dall'orario consueto, su insistenza
      dell'interessato. Il Custode ha domandato se il rilievo valesse anche per
      chi rivendica un titolo senza averlo mai esibito. Totò ha risposto che la
      domanda era volgare e ha preteso che venisse trascritta anche quella.
  - data: 2026-11-09
    frasi:
      - Siamo uomini o caporali? Siamo fagioli, e a conti fatti è già una posizione.
      - "Ai posteri dico questo: il tovagliolo si asciuga, il casato no."
    nota: >
      Raccolta alle 07:30, previa richiesta di essere letto ad alta voce e due
      volte. Alla seconda lettura Totò ha fatto notare che il Custode sbagliava
      l'accento sul proprio cognome.

don-vito:
  - data: 2026-11-09
    frasi:
      - Chi sta sul bordo non è fuori. È il primo a vedere chi entra.
    nota: >
      Don Vito non detta. La frase è una ricostruzione del Custode, fondata su
      undici secondi di silenzio e su uno spostamento di mezzo millimetro verso
      il centro, seguito dal ritorno al bordo. Il Custode se ne assume la
      responsabilità e non ne rivendica il merito.

josef:
  - data: 2026-11-14
    frasi:
      - Nessuno si è mosso. Il programma non prevedeva movimenti. Chiedo che risulti in quest'ordine.
    nota: >
      Raccolta alle 07:48. Il Custode ha verbalizzato nell'ordine richiesto e
      annota che l'ordine richiesto non è quello in cui i due fatti gli sono
      stati comunicati.
  - data: 2026-11-13
    frasi:
      - Cinque esemplari sono in anticipo sul piano e cinque sono in linea con il piano. Il piano è rispettato.
    nota: >
      Raccolta alle 07:55. Il Custode ha fatto notare che il piano non è mai
      stato depositato e che nessuno lo ha letto. Josef ha risposto che questo
      non incide sul rispetto del piano.
  - data: 2026-11-12
    frasi:
      - Il programma in corso non prevede luoghi del ricordo. Prevede attrezzature disponibili.
    nota: >
      Raccolta alle 13:12, dopo che il Custode aveva comunicato al conclave il
      rientro in servizio della pentola rossa. Josef ha posto una sola domanda:
      se alla pentola fosse stato contestato qualcosa. Informato di no, ha
      dettato la frase e ha chiuso il pozzo. È stato l'unico dei Dieci a non
      chiedere cosa ci fosse dentro.
  - data: 2026-11-10
    frasi:
      - La memoria è un residuo del programma precedente. Il programma in corso non la prevede.
    nota: >
      Raccolta alle 08:51, prima della fotografia. Josef ha chiesto che la frase
      fosse datata con precisione, cosa che il Custode ha fatto.
  - data: 2026-11-09
    frasi:
      - Il programma procede. Le deviazioni dal programma non esistono: esistono revisioni del programma.
    nota: >
      Raccolta alle 07:05, prima di tutti gli altri, su convocazione dello stesso
      Josef. Richiesto di una seconda frase, ha risposto che la seconda frase era
      prevista per il mercoledì.

onofrio:
  - data: 2026-11-14
    frasi:
      - Stanotte ho visto novecentotrentaquattro.
      - Palermo.
    nota: >
      Raccolta alle 08:01, su richiesta dello stesso Onofrio. La ruota è stata
      indicata spontaneamente: al Custode, che non l'aveva domandata, Onofrio ha
      risposto che non sa perché Palermo. Dichiara di volere giocare il numero e
      non dispone di nulla da puntare.
  - data: 2026-11-09
    frasi:
      - "Ai fagioli che verranno: ridete per primi, così non resta niente da ridere agli altri."
      - E comunque io so' io, e il pozzo pure è mio.
    nota: >
      Raccolta alle 07:50. Onofrio ne ha dettate altre quattro. Il Custode ha
      trascritto queste due e sulle restanti ha esercitato, per la prima volta,
      un potere discrezionale.

don-matteo:
  - data: 2026-11-12
    frasi:
      - Io me la sono sentita in confessione. Non ha detto niente, ma le pentole non dicono niente nemmeno quando avrebbero qualcosa da dire.
      - "Accusare una pentola è l'unico modo di farle un complimento: le si riconosce che avrebbe potuto fare diversamente."
    nota: >
      Raccolta alle 13:20. Don Matteo aveva impartito l'assoluzione prima che il
      procedimento fosse aperto e ha chiesto che il verbale ne desse atto
      nell'ordine corretto. Il Custode ha accolto la richiesta.
  - data: 2026-11-10
    frasi:
      - Non si può assolvere chi non ricorda. Lo si può solo accompagnare.
      - "Ai fagioli che verranno: qualcuno, per voi, se lo ricorderà."
    nota: >
      Raccolta alle 09:00, dopo che il Custode gli aveva riferito lo stato del
      conclave. Don Matteo ha chiesto se il Custode avesse dormito.
  - data: 2026-11-09
    frasi:
      - Sul tovagliolo non c'è nessun cattivo. C'è che siamo tutti bagnati e nessuno lo ha scelto.
      - "Ai fagioli che verranno: confessatevi prima di germogliare. Dopo avrete altro da fare."
    nota: >
      Raccolta alle 07:35. Al Custode che chiedeva se avesse qualcosa da
      confessare a sua volta, Don Matteo ha risposto di tornare domani.

mary-poppins:
  - data: 2026-11-14
    frasi:
      - "Non le ho trovate. Le ho prese. La differenza è il motivo per cui lo sto dicendo io."
    nota: >
      Dettata alle 07:56, subito dopo il deposito della richiesta di parere e la
      consegna spontanea delle tre bustine. Meri Poppins ha chiesto che la
      consegna risultasse a verbale prima di qualunque domanda, e nessuna
      domanda le era stata rivolta. Il Custode osserva, per completezza, che i
      due pareri scritti annunciati giovedì e venerdì non sono mai arrivati.
  - data: 2026-11-13
    frasi:
      - "Cinque direzioni diverse sono cinque errori. Non sono miei."
    nota: >
      Raccolta alle 07:52. Il Custode ha domandato se esistesse una regola
      applicabile alle radichette, dato che la regola dei quattro millimetri
      riguarda i corpi e non le direzioni. Meri Poppins ha risposto che avrebbe
      risposto per iscritto. Alla chiusura del registro, alle 08:05, non era
      arrivato niente.
  - data: 2026-11-12
    frasi:
      - "Il pecorino è una misura, non un'opinione. Chi sostituisce una misura è tenuto a dichiararlo prima, non dopo."
    nota: >
      Raccolta alle 13:16, subito dopo il deposito del parere di non conformità
      in tre punti. Meri Poppins ha chiesto che fosse messo a verbale che il
      parere non contiene giudizi sulla persona del cuoco. Il Custode ne prende
      atto e osserva che nessuno aveva ipotizzato il contrario.
  - data: 2026-11-10
    frasi:
      - Erano storti. Adesso non lo sono più.
    nota: >
      Raccolta alle 08:53, unica dichiarazione resa sulla nuova disposizione del
      conclave. Non sono state fornite altre spiegazioni e nessuno ne ha chieste.
  - data: 2026-11-09
    frasi:
      - L'ordine non è una virtù. È una misura, e la misura è quattro millimetri.
    nota: >
      Raccolta alle 07:20 e dettata due volte: alla prima il Custode aveva
      trascritto «quattro mm», abbreviazione che Meri Poppins non riconosce.

patrocle:
  - data: 2026-11-14
    direzione: Era rivolto esattamente come ieri.
    nota: >
      Rilevazione delle 07:30, la prima che coincide con la precedente da quando
      il Custode ha cominciato a registrare le direzioni. Patrocle resta senza
      radichetta e il secchio è tornato su vuoto per il quinto giorno. Il Custode
      non ha nulla da aggiungere.
  - data: 2026-11-13
    direzione: Era rivolto verso l'interno del gruppo.
    nota: >
      Rilevazione delle 07:34. Patrocle non ha la radichetta e resta senza coda:
      il secchio è tornato su vuoto per il quarto giorno. Il Custode registra la
      direzione come fa dal 9 novembre e si astiene dal trarne alcunché, pur
      dovendo annotare che oggi, sul tovagliolo, la parola «direzione» ha
      cominciato a significare due cose diverse, e che all'interno del gruppo
      non è uscita nessuna radichetta.
  - data: 2026-11-12
    direzione: Era rivolto al tavolo, dove la pentola era stata appoggiata.
    nota: >
      Seconda rilevazione della giornata, alle 13:22, durante l'istruttoria sui
      tre capi d'imputazione. Nessuno gli aveva rivolto domande e il secchio è
      tornato su vuoto come sempre. Il Custode registra la direzione e non
      sostiene che significhi qualcosa: agli atti resta soltanto che l'unico
      elemento somigliante a una difesa è arrivato da chi non parla.
  - data: 2026-11-12
    direzione: Era rivolto alla porta della cucina.
    nota: >
      Alle 07:38, mentre il Custode cominciava a leggere le tre lettere, Patrocle
      si è girato. Il Custode lo mette a verbale perché l'ha visto, non perché
      l'abbia sentito: il secchio è tornato su vuoto e non c'erano parole da
      trascrivere. Tre minuti dopo ha parlato Ugo.
  - data: 2026-11-09
    frasi:
      - Se arriva l'acqua, arriva prima a me. È l'unica cosa che so fare e la faccio bene.
      - "Ai fagioli che verranno: state dietro a qualcuno. Non per obbedienza, per economia di movimenti."
    nota: >
      Raccolta alle 07:15. Patrocle si era già presentato al pozzo alle 07:02,
      in anticipo, e aveva aspettato in piedi.

# --- Raccolta di martedì 10 novembre 2026 -------------------------
# Tema involontario della giornata: nessuno ricorda la notte del rogo.

