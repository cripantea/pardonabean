# ---------------------------------------------------------------
#  Pardon a Bean — configurazione Jekyll nativa per GitHub Pages
# ---------------------------------------------------------------

title: "Pardon a Bean"
description: "Cronaca di salvataggio, germinazione e memoria dei Dieci Legumi Supremi"
# --- Indirizzo del sito -----------------------------------------
# Configurazione ATTUALE: sito di progetto su github.io, servito
# dalla sottocartella /pardonabean/.
url: "https://cripantea.github.io"
baseurl: "/pardonabean"
#
# Quando pardonabean.it sara' registrato e i DNS propagati:
#   1. sostituire le due righe qui sopra con:
#        url: "https://pardonabean.it"
#        baseurl: ""
#   2. ripristinare il file CNAME:  echo pardonabean.it > CNAME
#   3. in Settings > Pages impostare il dominio personalizzato
# -----------------------------------------------------------------

# Motore Markdown supportato nativamente da GitHub Pages
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Struttura permalink del diario
permalink: /diario/:year/:month/:day/:title/

# Metadati autore / lore
author: "Il Custode del Tovagliolo"
lang: it

# Esclusioni dal build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
