# ---------------------------------------------------------------
#  Pardon a Bean — configurazione Jekyll nativa per GitHub Pages
# ---------------------------------------------------------------

title: "Pardon a Bean"
description: "Cronaca di salvataggio, germinazione e memoria dei Dieci Legumi Supremi"
# --- Indirizzo del sito -----------------------------------------
# Dominio personalizzato pardonabean.it, servito dalla radice.
# Il file CNAME nella root del repo deve contenere lo stesso dominio.
url: "https://pardonabean.it"
baseurl: ""
# -----------------------------------------------------------------

# Motore Markdown supportato nativamente da GitHub Pages
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Struttura permalink del diario
permalink: /diario/:year/:month/:day/:title/

# --- Statistiche di visita ---------------------------------------
# provider: goatcounter | plausible | umami | cloudflare | google
#           (vuoto = nessuna statistica, nessuno script caricato)
# code:     il codice fornito dal servizio scelto, ovvero
#           goatcounter -> il nome del sito scelto in fase di
#                          registrazione (es. "pardonabean" per
#                          pardonabean.goatcounter.com)
#           plausible   -> il dominio, cioe' pardonabean.it
#           umami       -> il website id
#           cloudflare  -> il token del beacon
#           google      -> l'id di misurazione G-XXXXXXXXXX
#
# Gli script vengono inclusi solo nella build di produzione.
analytics:
  provider: "goatcounter"   # scelto perche' cookieless: nessun banner richiesto
  code: "pardonabean"       # https://pardonabean.goatcounter.com
  nota_privacy: true        # mostra in footer la nota sulle statistiche anonime
# -----------------------------------------------------------------

# Metadati autore / lore
author: "Il Custode del Tovagliolo"
lang: it

# Esclusioni dal build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
